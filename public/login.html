<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / Register - Clipping Tracking Bot</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
            width: 100%;
            max-width: 450px;
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2em;
            text-align: center;
        }
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            text-align: center;
        }
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            border-bottom: 2px solid #e5e7eb;
        }
        .tab {
            flex: 1;
            padding: 12px;
            background: none;
            border: none;
            border-bottom: 3px solid transparent;
            cursor: pointer;
            font-size: 1em;
            font-weight: 600;
            color: #666;
            transition: all 0.2s;
        }
        .tab.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }
        .form-content {
            display: none;
        }
        .form-content.active {
            display: block;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
            font-size: 0.9em;
        }
        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e5e7eb;
            border-radius: 6px;
            font-size: 1em;
            transition: border-color 0.2s;
        }
        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
        }
        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-primary {
            background: #667eea;
            color: white;
        }
        .btn-primary:hover {
            background: #5568d3;
        }
        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .error {
            background: #fee2e2;
            color: #991b1b;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 0.9em;
            display: none;
        }
        .error.show {
            display: block;
        }
        .success {
            background: #d1fae5;
            color: #065f46;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 0.9em;
            display: none;
        }
        .success.show {
            display: block;
        }
        .loading {
            display: none;
            text-align: center;
            color: #666;
            margin-top: 10px;
        }
        .loading.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📹 Clipping Tracking Bot</h1>
        <p class="subtitle">Login or create an account</p>

        <div class="tabs">
            <button class="tab active" onclick="switchTab('login')">Login</button>
            <button class="tab" onclick="switchTab('register')">Register</button>
        </div>

        <div id="error-message" class="error"></div>
        <div id="success-message" class="success"></div>

        <!-- Login Form -->
        <div id="login-form" class="form-content active">
            <form onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>Email or Username</label>
                    <input type="text" id="login-email" placeholder="your@email.com or username" required>
                </div>
                <div class="form-group">
                    <label>Password (optional for testing)</label>
                    <input type="password" id="login-password" placeholder="Leave empty for testing">
                </div>
                <button type="submit" class="btn btn-primary" id="login-btn">Login</button>
                <div id="login-loading" class="loading">Logging in...</div>
            </form>
        </div>

        <!-- Register Form -->
        <div id="register-form" class="form-content">
            <form onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label>Email *</label>
                    <input type="email" id="register-email" placeholder="your@email.com" required>
                </div>
                <div class="form-group">
                    <label>Username (optional)</label>
                    <input type="text" id="register-username" placeholder="username" title="3-20 characters (letters, numbers, _, -)" minlength="3" maxlength="20">
                    <div style="font-size: 0.85em; color: #666; margin-top: 4px;">3-20 characters (letters, numbers, _, -). Optional for testing.</div>
                </div>
                <div class="form-group">
                    <label>Password (optional for testing)</label>
                    <input type="password" id="register-password" placeholder="Leave empty for testing" minlength="6">
                </div>
                <div class="form-group">
                    <label>Role *</label>
                    <select id="register-role" required>
                        <option value="CLIPPER">Clipper</option>
                        <option value="ADMIN">Admin</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary" id="register-btn">Create Account</button>
                <div id="register-loading" class="loading">Creating account...</div>
            </form>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin;

        function switchTab(tab) {
            // Update tabs
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.form-content').forEach(f => f.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById(`${tab}-form`).classList.add('active');
            
            // Clear messages
            hideMessages();
        }

        function showError(message) {
            const errorEl = document.getElementById('error-message');
            errorEl.textContent = message;
            errorEl.classList.add('show');
            document.getElementById('success-message').classList.remove('show');
        }

        function showSuccess(message) {
            const successEl = document.getElementById('success-message');
            successEl.textContent = message;
            successEl.classList.add('show');
            document.getElementById('error-message').classList.remove('show');
        }

        function hideMessages() {
            document.getElementById('error-message').classList.remove('show');
            document.getElementById('success-message').classList.remove('show');
        }

        async function handleLogin(event) {
            event.preventDefault();
            hideMessages();

            const emailOrUsername = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value;
            const btn = document.getElementById('login-btn');
            const loading = document.getElementById('login-loading');

            if (!emailOrUsername) {
                showError('Please enter email or username');
                return;
            }

            btn.disabled = true;
            loading.classList.add('show');

            try {
                // Determine if it's email or username
                const isEmail = emailOrUsername.includes('@');
                const loginData = isEmail 
                    ? { email: emailOrUsername, password: password || undefined }
                    : { username: emailOrUsername, password: password || undefined };

                const response = await fetch(`${API_BASE}/api/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(loginData),
                });

                const data = await response.json();

                if (response.ok) {
                    // Store token in localStorage
                    localStorage.setItem('authToken', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    
                    showSuccess('Login successful! Redirecting...');
                    
                    // Redirect based on role
                    setTimeout(() => {
                        if (data.user.role === 'ADMIN') {
                            window.location.href = '/admin.html';
                        } else {
                            window.location.href = '/';
                        }
                    }, 1000);
                } else {
                    showError(data.error || 'Login failed');
                    btn.disabled = false;
                    loading.classList.remove('show');
                }
            } catch (error) {
                showError(`Error: ${error.message}`);
                btn.disabled = false;
                loading.classList.remove('show');
            }
        }

        async function handleRegister(event) {
            event.preventDefault();
            hideMessages();

            const email = document.getElementById('register-email').value.trim();
            const username = document.getElementById('register-username').value.trim();
            const password = document.getElementById('register-password').value;
            const role = document.getElementById('register-role').value;
            const btn = document.getElementById('register-btn');
            const loading = document.getElementById('register-loading');

            if (!email) {
                showError('Please fill in email');
                return;
            }

            // Validate username format if provided (optional)
            if (username && username.trim()) {
                const usernameRegex = /^[a-zA-Z0-9_-]{3,20}$/;
                if (!usernameRegex.test(username.trim())) {
                    showError('Username must be 3-20 characters (letters, numbers, _, -)');
                    return;
                }
            }

            // Password is optional for testing, but if provided, must be at least 6 chars
            if (password && password.length > 0 && password.length < 6) {
                showError('Password must be at least 6 characters');
                return;
            }

            btn.disabled = true;
            loading.classList.add('show');

            try {
                const response = await fetch(`${API_BASE}/api/auth/register`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ 
                        email, 
                        username, 
                        password: password || undefined, 
                        role 
                    }),
                });

                const data = await response.json();

                if (response.ok) {
                    // Store token in localStorage
                    localStorage.setItem('authToken', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    
                    showSuccess('Account created! Redirecting...');
                    
                    // Redirect based on role
                    setTimeout(() => {
                        if (data.user.role === 'ADMIN') {
                            window.location.href = '/admin.html';
                        } else {
                            window.location.href = '/';
                        }
                    }, 1000);
                } else {
                    // Show detailed error message
                    const errorMsg = data.error || data.message || 'Registration failed';
                    const details = data.details ? ` (${data.details})` : '';
                    showError(`${errorMsg}${details}`);
                    btn.disabled = false;
                    loading.classList.remove('show');
                }
            } catch (error) {
                showError(`Error: ${error.message}`);
                btn.disabled = false;
                loading.classList.remove('show');
            }
        }

        // Check if already logged in
        const token = localStorage.getItem('authToken');
        if (token) {
            // Verify token is still valid
            fetch(`${API_BASE}/api/auth/me`, {
                headers: {
                    'Authorization': `Bearer ${token}`,
                },
            })
            .then(res => res.json())
            .then(data => {
                if (data.user) {
                    // Already logged in, redirect
                    if (data.user.role === 'ADMIN') {
                        window.location.href = '/admin.html';
                    } else {
                        window.location.href = '/';
                    }
                }
            })
            .catch(() => {
                // Token invalid, stay on login page
                localStorage.removeItem('authToken');
                localStorage.removeItem('user');
            });
        }
    </script>
</body>
</html>
