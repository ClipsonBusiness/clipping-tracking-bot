<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clipper Dashboard - Campaigns</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5em;
        }
        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }
        .campaign-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        .campaign-card {
            background: #f9fafb;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            padding: 20px;
            transition: all 0.3s;
        }
        .campaign-card:hover {
            border-color: #667eea;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.2);
        }
        .campaign-card.joined {
            border-color: #10b981;
            background: #f0fdf4;
        }
        .campaign-name {
            font-size: 1.3em;
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
        }
        .campaign-description {
            color: #666;
            font-size: 0.9em;
            margin-bottom: 15px;
            min-height: 40px;
        }
        .campaign-stats {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
            font-size: 0.85em;
            color: #666;
        }
        .campaign-stats span {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-size: 0.9em;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 600;
        }
        .btn-primary {
            background: #667eea;
            color: white;
        }
        .btn-primary:hover {
            background: #5568d3;
        }
        .btn-success {
            background: #10b981;
            color: white;
        }
        .btn-success:hover {
            background: #059669;
        }
        .submission-section {
            margin-top: 40px;
            padding-top: 40px;
            border-top: 2px solid #e5e7eb;
        }
        .submission-form {
            background: #f9fafb;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #333;
        }
        .form-group select,
        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 1em;
        }
        .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 1em;
            min-height: 100px;
            font-family: monospace;
        }
        .alert {
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 15px;
        }
        .alert-success {
            background: #d1fae5;
            color: #065f46;
            border: 1px solid #10b981;
        }
        .alert-error {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #ef4444;
        }
        .alert-info {
            background: #dbeafe;
            color: #1e40af;
            border: 1px solid #3b82f6;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎬 Clipper Dashboard</h1>
        <p class="subtitle">Join campaigns and submit your content</p>

        <div id="campaigns-container">
            <div style="text-align: center; padding: 40px; color: #666;">
                Loading campaigns...
            </div>
        </div>

        <div class="submission-section" id="submission-section" style="display: none;">
            <h2 style="margin-bottom: 20px;">📤 Submit Content</h2>
            <div class="submission-form">
                <div class="form-group">
                    <label>Campaign</label>
                    <select id="selected-campaign">
                        <option value="">Select a campaign...</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Content URL</label>
                    <textarea id="content-url" placeholder="Paste YouTube, TikTok, or Instagram URL here..."></textarea>
                </div>
                <button class="btn btn-primary" onclick="submitContent()">Submit Content</button>
            </div>
            <div id="submission-result"></div>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin;
        let campaigns = [];
        let joinedCampaigns = [];

        async function loadCampaigns() {
            try {
                const response = await fetch(`${API_BASE}/api/campaigns`, {
                    headers: {
                        'x-user-id': 'test-user-123',
                        'x-user-role': 'CLIPPER'
                    }
                });
                const data = await response.json();
                
                if (response.ok) {
                    campaigns = data.campaigns || [];
                    joinedCampaigns = campaigns.filter(c => c.joined).map(c => c.id);
                    renderCampaigns();
                    updateSubmissionForm();
                } else {
                    document.getElementById('campaigns-container').innerHTML = 
                        `<div class="alert alert-error">Error loading campaigns: ${data.error || 'Unknown error'}</div>`;
                }
            } catch (error) {
                document.getElementById('campaigns-container').innerHTML = 
                    `<div class="alert alert-error">Error: ${error.message}</div>`;
            }
        }

        function renderCampaigns() {
            const container = document.getElementById('campaigns-container');
            
            if (campaigns.length === 0) {
                container.innerHTML = '<div class="alert alert-info">No active campaigns available.</div>';
                return;
            }

            container.innerHTML = '<h2 style="margin-bottom: 20px;">🎯 Active Campaigns</h2><div class="campaign-grid">' +
                campaigns.map(campaign => `
                    <div class="campaign-card ${campaign.joined ? 'joined' : ''}">
                        <div class="campaign-name">${campaign.name}</div>
                        <div class="campaign-description">${campaign.description || 'No description'}</div>
                        <div class="campaign-stats">
                            <span>👥 ${campaign.memberCount} members</span>
                            <span>📹 ${campaign.submissionCount} submissions</span>
                        </div>
                        ${campaign.joined 
                            ? '<div class="alert alert-success" style="margin: 0; padding: 8px; font-size: 0.85em;">✓ Joined</div>'
                            : `<button class="btn btn-primary" onclick="joinCampaign('${campaign.id}')">Join Campaign</button>`
                        }
                    </div>
                `).join('') + '</div>';
        }

        async function joinCampaign(campaignId) {
            try {
                const response = await fetch(`${API_BASE}/api/campaigns/${campaignId}/join`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-user-id': 'test-user-123',
                        'x-user-role': 'CLIPPER'
                    }
                });
                const data = await response.json();
                
                if (response.ok) {
                    // Reload campaigns
                    await loadCampaigns();
                    document.getElementById('submission-section').style.display = 'block';
                } else {
                    alert(`Error: ${data.error || 'Failed to join campaign'}`);
                }
            } catch (error) {
                alert(`Error: ${error.message}`);
            }
        }

        function updateSubmissionForm() {
            const select = document.getElementById('selected-campaign');
            const joined = campaigns.filter(c => c.joined);
            
            select.innerHTML = '<option value="">Select a campaign...</option>' +
                joined.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
            
            if (joined.length > 0) {
                document.getElementById('submission-section').style.display = 'block';
            }
        }

        async function submitContent() {
            const campaignId = document.getElementById('selected-campaign').value;
            const url = document.getElementById('content-url').value.trim();
            const resultDiv = document.getElementById('submission-result');
            
            if (!campaignId) {
                resultDiv.innerHTML = '<div class="alert alert-error">Please select a campaign</div>';
                return;
            }
            
            if (!url) {
                resultDiv.innerHTML = '<div class="alert alert-error">Please enter a content URL</div>';
                return;
            }

            resultDiv.innerHTML = '<div class="alert alert-info">Submitting...</div>';

            try {
                const response = await fetch(`${API_BASE}/api/submissions/auto`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-user-id': 'test-user-123',
                        'x-user-role': 'CLIPPER'
                    },
                    body: JSON.stringify({ url, campaignId })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    resultDiv.innerHTML = '<div class="alert alert-success">✓ Content submitted successfully! It will appear in the admin dashboard.</div>';
                    document.getElementById('content-url').value = '';
                    // Reload campaigns to update submission count
                    await loadCampaigns();
                } else {
                    resultDiv.innerHTML = `<div class="alert alert-error">Error: ${data.error || data.message || 'Failed to submit'}</div>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<div class="alert alert-error">Error: ${error.message}</div>`;
            }
        }

        // Load campaigns on page load
        loadCampaigns();
    </script>
</body>
</html>
